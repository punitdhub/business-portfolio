<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111317"/>
      <stop offset="100%" stop-color="#1C1F26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#A8BDD1"/>
      <stop offset="100%" stop-color="#C8D1DC"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#A8BDD1" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Shield + gem -->
  <g transform="translate(1000 300) scale(0.85)">
    <path d="M0 -160 L130 -100 V40 C130 130 70 200 0 230 C-70 200 -130 130 -130 40 V-100 Z"
          fill="none" stroke="url(#accent)" stroke-width="3" stroke-linejoin="round" opacity="0.9"/>
    <path d="M0 -80 L60 0 L0 110 L-60 0 Z" fill="url(#accent)" opacity="0.95"/>
    <path d="M0 -80 L60 0 L-60 0 Z" fill="#A8BDD1" opacity="0.45"/>
  </g>
  <!-- Tag -->
  <text x="80" y="118" font-family="JetBrains Mono, monospace" font-size="20" fill="#A8BDD1" letter-spacing="6">FORTIUM GROUP</text>
  <!-- Headline -->
  <text x="80" y="235" font-family="Inter, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#ECEEF3">Cyber &amp; AI Security</text>
  <text x="80" y="315" font-family="Inter, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="url(#accent)">Recruiting, vetted by</text>
  <text x="80" y="395" font-family="Inter, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="url(#accent)">practitioners.</text>
  <!-- Subline -->
  <text x="80" y="465" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#9CA3AF">Direct-hire · 5-stage vetting · 7-business-day shortlist target</text>
  <text x="80" y="503" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#9CA3AF">Gems, not just resumes.</text>
  <!-- Foot -->
  <text x="80" y="568" font-family="JetBrains Mono, monospace" font-size="17" fill="#8A919C" letter-spacing="4">PUNITDHUB.GITHUB.IO/BUSINESS-PORTFOLIO</text>
</svg>
